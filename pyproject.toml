[project]
name = "bidgely-avista"
version = "0.2.1"
license = "Apache-2.0"
description = "A python library for downloading your historical data fromutilities that use Bidgely"
authors = [{ name = "Nick Bogle", email = "nick@bogle.net" }, { name = "Carter Green", email = "carter.green@icloud.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "aiohttp>=3.8.5,<4.0.0",
    "boto3>=1.26.32,<2.0.0",
    "py3rijndael>=0.3.3,<0.4.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/nick-bogle/bidgely"
"Bug Tracker" = "https://github.com/nick-bogle/bidgely/issues"

[tool.poetry]
# The distribution is bidgely-avista but the import package is still bidgely,
# so Poetry cannot infer the directory from the name.
packages = [{ include = "bidgely" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
black = "^23.7.0"
ruff = "^0.0.285"
flake8 = "^6.1.0"
pre-commit = ">=3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"bidgely/utilities/aws_srp.py" = ["ALL"]

[tool.mypy]
plugins = [
    "pydantic.mypy"
]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
